defaults:
  - default_dataset.yaml

exp_name: "demo"
img_size: 448
num_workers: 8
seed_value: 42
accum_steps: 1
patch_size: 14
val_epoch_freq: 1
max_img_per_gpu: 18
max_scenes_per_gpu: 1
gs_mode: "GGGS"
backend_feature: 128
backend_dense_head_features: 256

limit_train_batches: 700
limit_val_batches: 400
img_nums: [3, 18]

data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    max_scenes_per_gpu: ${max_scenes_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: True
      repeat_batch: False
      img_nums: ${img_nums}
      # training: False
      rescale_aug: False
      augs:
        scales: null
        aspects: [0.5, 0.5]
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:


        - _target_: data.datasets.iggt.IGGT
          split: train
          IGGT_DIR: train_data/iggt
          len_train: 700
          # len_train: 50
          expand_ratio: 1

  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    max_scenes_per_gpu: ${max_scenes_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: True
      img_nums: ${img_nums}
      augs:
        aspects: [0.5, 0.5]
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.iggt.IGGT
          IGGT_DIR: train_data/iggt
          len_train: 50
          expand_ratio: 1

checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 30
  auto_resume: False
  resume_checkpoint_path: null
  strict: False

logging:
  log_dir: logs
  log_visuals: False
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: logs/${exp_name}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
        - loss_conf_point
        - loss_reg_point
        - loss_grad_point
        - baseline_objective
        - refined_objective
        - loss_refinement
        - loss_refine_penalty_depth
        - loss_refine_penalty_camera
        - loss_refine_penalty_point
        - loss_gs_rgb
        - loss_gs_normal
        - loss_gs_dist
        - loss_gs_depth 
        - depth_align_loss
        - highres_backend_voxel_point_ratio
    val:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
        - loss_conf_point
        - loss_reg_point
        - loss_grad_point
        - baseline_objective
        - refined_objective
        - loss_refinement
        - loss_refine_penalty_depth
        - loss_refine_penalty_camera
        - loss_refine_penalty_point
        - loss_gs_rgb
        - loss_gs_normal
        - loss_gs_dist
        - loss_gs_depth 
        - depth_align_loss
        - highres_backend_voxel_point_ratio
        - psnr_gs_demo

loss:
  _target_: loss.MultitaskLoss
  camera:
    weight: 5.0
    loss_type: "l1"
  depth:
    weight: 1.0
    gradient_loss_fn: "grad"
    valid_range: 0.98
  point:
    weight: 1.0
    gradient_loss_fn: "normal"
    valid_range: 0.98
  track: null
  gs:
    weight: 10.0
    l1_weight: 1.0
    lambda_dssim: 0.1
    lambda_dist: 0.0
    lambda_depth: 0.25
    lambda_depth_align: 0.25
    lambda_normal: 0.001
    gs_mode: ${gs_mode}
  tsdf: null
  align_moge: true
  refinement:
    enabled: true
    improvement_weight: 3.0
    margin: 0.0
    use_depth: true
    use_camera: true
    use_point: true

optim:
  param_group_modifiers: False
  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-6
    weight_decay: 0.05

  frozen_module_names: 
      - "*model.backbone*"  
      - "*cam_enc*"
      - "*aux*"
      - "*cam_dec*"
      - "*model.head*"
      # - "model.backend"
      # - "*backend_gs_decoder*"

  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["model"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      # - scheduler:
      #     _target_: fvcore.common.param_scheduler.CompositeParamScheduler
      #     schedulers:
      #       - _target_: fvcore.common.param_scheduler.LinearParamScheduler
      #         start_value: 1e-8
      #         end_value: 5e-5
      #       - _target_: fvcore.common.param_scheduler.CosineParamScheduler
      #         start_value: 5e-5
      #         end_value: 1e-8
      #     lengths: [0.05, 0.95]
      #     interval_scaling: ['rescaled', 'rescaled']
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 1e-6
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 1e-6
              end_value: 1e-8
          lengths: [0.0, 1.0]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05

max_epochs: 100

model:
  _target_: vggt.models.depthanything3.DepthAnything3
  model_name: da3-giant
  config:
    __object__:
      path: depth_anything_3.model.da3
      name: DepthAnything3Net
      args: as_params
    net:
      __object__:
        path: depth_anything_3.model.dinov2.dinov2
        name: DinoV2
        args: as_params
      name: vitg
      out_layers: [19, 27, 33, 39]
      alt_start: 13
      qknorm_start: 13
      rope_start: 13
      cat_token: true
    head:
      __object__:
        path: depth_anything_3.model.dualdpt
        name: DualDPT
        args: as_params
      dim_in: 3072
      output_dim: 2
      features: 256
      out_channels: [256, 512, 1024, 1024]
    cam_enc:
      __object__:
        path: depth_anything_3.model.cam_enc
        name: CameraEnc
        args: as_params
      dim_out: 1536
    cam_dec:
      __object__:
        path: depth_anything_3.model.cam_dec
        name: CameraDec
        args: as_params
      dim_in: 3072
    backend_dense_head:
      __object__:
        path: depth_anything_3.model.backend_dense_dpt
        name: BackendDenseDPT
        args: as_params
      dim_in: 3072
      patch_size: 14
      output_dim: 1
      activation: linear
      conf_activation: linear
      features: ${backend_dense_head_features}
      out_channels: [256, 512, 1024, 1024]
      pos_embed: True
      down_ratio: 1
      head_name: backend_dense
      use_sky_head: False
      norm_type: layer
    backend_gs_decoder:
      __object__:
        path: vggt.heads.voxel_gs_adapter
        name: VoxelGSAdapter
        args: as_params
      backend_out_dim: ${backend_feature}
      gaussian_splits: 2
      sh_degree: 2
      pred_color: False
      gaussian_scale_min: 1e-05
      gaussian_scale_max: 0.002
      gaussian_offset_max: 0.004
      backbone_dim: 512
    backend:
      __object__:
        path: vggt.models.amb3r.backend
        name: BackEnd
        args: as_params
      in_dim: 3072
      out_dim: 1024
      k_neighbors: 16
    use_ray_pose: False
    backend_option:
      high_resolution_uptimes: 14
      low_resolution_uptimes: 2
      high_resolution_voxelsize: 0.002
      low_resolution_voxelsize: 0.02
  gs_mode: ${gs_mode}
  infer_gs: True
  use_manual_metric_scaling: True
  manual_metric_divisor: 300.0
  # skip_load_module_names:
  #   - "*model.gs_head*"


  # pretrained_weight: null
  pretrained_weight: weight/da3/weights_gaint_1.1/model.safetensors
  # pretrained_weight: 
  load_pretrained: True


  gs_from_backend: True

distributed:
  backend: nccl
  comms_dtype: None
  find_unused_parameters: False
  timeout_mins: 20
  gradient_as_bucket_view: False
  bucket_cap_mb: 1
  broadcast_buffers: False
  init_sync: False

cuda:
  cudnn_deterministic: False
  cudnn_benchmark: False
  allow_tf32: True
